[package]
name = "iced-css"
description = "CSS support for iced lib"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
log = "=0.4.34"
iced.workspace = true
iced-css-core.workspace = true
iced-css-macro.workspace = true
iced_animate = { path = "/home/user/tmpmy/luminate/animate" }

# Qualified TLS profile; explicit pins keep the retained qualification reproducible.
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
rustls = { version = "=0.23.43", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "=1.0.9"
ring = { version = "=0.17.14", default-features = false }
notify = "=8.2.0"
# Public bounded SFNT table parsing; shaping remains the selected HarfRust service.
ttf-parser = { version = "=0.25.1", default-features = false, features = ["std"] }

# Bounded HTTP gzip/zlib decoding with the already-locked Rust backend.
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }

# The scripts cosmic-text asks fallback faces for, to place baselines as it shapes them.
unicode-script = "=0.5.8"

[dev-dependencies]
iced_test.workspace = true
png = "0.18"

[features]
default = ["wgpu", "tiny-skia"]
wgpu = ["iced/wgpu"]
tiny-skia = ["iced/tiny-skia"]
image-without-codecs = ["iced/image-without-codecs"]
image = ["image-without-codecs", "iced/image"]
svg = ["iced/svg"]

[package]
name = "iced-css"
description = "CSS support for iced lib"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
readme.workspace = true

[dependencies]
log = "=0.4.35"
iced.workspace = true
iced-css-core.workspace = true
iced-css-macro.workspace = true
iced_animate = { version = "0.1.0", git = "https://github.com/sonata-ltd/luminate", rev = "77a4ae2c7f2cd15bf8a4820ad3ae536bf72a6d15" }

# Qualified TLS profile; explicit pins keep the retained qualification reproducible.
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "=1.0.12"
ring = { version = "=0.17.14", default-features = false }
notify = "=8.2.2"
# Public bounded SFNT table parsing; shaping remains the selected HarfRust service.
ttf-parser = { version = "=0.25.1", default-features = false, features = ["std"] }

# Bounded HTTP gzip/zlib decoding with the already-locked Rust backend.
flate2 = { version = "=1.1.11", default-features = false, features = ["zlib-rs"] }

# The scripts cosmic-text asks fallback faces for, to place baselines as it shapes them.
unicode-script = "=0.5.9"
# The words cosmic-text shapes, each with its own fallback faces.
unicode-linebreak = "=0.1.5"

# The platform's own `O_NONBLOCK`, for an open that cannot block on a FIFO.
[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[dev-dependencies]
iced_test.workspace = true
png = "0.18"

[features]
default = ["wgpu", "tiny-skia"]
wgpu = ["iced/wgpu"]
tiny-skia = ["iced/tiny-skia"]
image-without-codecs = ["iced/image-without-codecs"]
image = ["image-without-codecs", "iced/image"]
svg = ["iced/svg"]
